<!DOCTYPE html>

<head>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#12052b;color:#fff;font-family:'Bungee',Impact,'Arial Black',sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:#fff;cursor:pointer}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;top:0;left:0;right:0;padding:12px 14px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;text-shadow:0 2px 0 #000,0 0 12px #f0f}
#hud .l div{line-height:1.2}
#aura{font-size:26px;color:#fff34d}
#coins{font-size:16px;color:#7dfcff}
#status{font-size:14px;color:#ff9df8;min-height:20px;white-space:pre-line}
#mute{pointer-events:auto;font-size:20px;width:46px;height:46px;border-radius:14px;border:3px solid #fff;background:#2b0f5c}
#fart{position:fixed;right:14px;bottom:22px;font-size:22px;padding:12px 16px;border-radius:20px;border:3px solid #fff;background:linear-gradient(180deg,#7dff5c,#1c8a10);box-shadow:0 5px 0 #0b3f06;text-shadow:0 2px 0 #000}
#fart.off{filter:grayscale(1);opacity:.5}
#hint{position:fixed;left:0;right:0;bottom:90px;text-align:center;font-size:18px;color:#fff34d;text-shadow:0 2px 0 #000;pointer-events:none;animation:pulse .4s infinite alternate}
#pops{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.pop{position:absolute;white-space:nowrap;font-size:22px;transform:translate(-50%,-50%);animation:pop .9s ease-out forwards;text-shadow:0 3px 0 #000,0 0 14px currentColor}
.pop.big{font-size:min(13vw,80px);animation:popbig 1.3s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-8deg)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.2) rotate(6deg)}100%{opacity:0;transform:translate(-50%,-140%) scale(1) rotate(-4deg)}}
@keyframes popbig{0%{opacity:0;transform:translate(-50%,-50%) scale(.1) rotate(-20deg)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.25) rotate(8deg)}30%{transform:translate(-50%,-50%) scale(.95) rotate(-6deg)}45%{transform:translate(-50%,-50%) scale(1.1) rotate(5deg)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.6) rotate(0)}}
.emo{position:absolute;top:-50px;font-size:34px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
#menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;background:radial-gradient(circle at 50% 30%,rgba(120,30,200,.6),rgba(10,2,30,.9))}
#menu h1{font-size:min(13vw,64px);line-height:.95;color:#fff34d;text-shadow:0 4px 0 #ff2bd6,0 8px 0 #2be4ff,0 0 30px #f0f;animation:wob 1.2s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-3deg) scale(1)}50%{transform:rotate(3deg) scale(1.06)}}
#sub{font-size:14px;color:#7dfcff;max-width:320px;line-height:1.35}
#stats{font-size:16px;line-height:1.5}
#stats b,#bank b{color:#fff34d}
.big{font-size:24px;padding:13px 30px;border-radius:20px;border:4px solid #fff;background:linear-gradient(180deg,#ff2bd6,#8a2bff);box-shadow:0 6px 0 #3a0a6b,0 0 30px #f0f}
#go{animation:pulse .6s ease-in-out infinite alternate}
#shopBtn{font-size:18px;background:linear-gradient(180deg,#2be4ff,#1a5cff);box-shadow:0 6px 0 #0a2a6b}
@keyframes pulse{to{transform:scale(1.07)}}
#how{font-family:system-ui,sans-serif;font-size:12.5px;opacity:.9;line-height:1.5;max-width:320px}
#shop{position:fixed;inset:0;display:flex;flex-direction:column}
#shop header{display:flex;justify-content:space-between;align-items:center;background:#0e0328;padding:10px 14px}
#tabs{display:flex;background:#0e0328;padding:0 14px 10px;gap:8px}
#tabs button{flex:1;font-size:14px;padding:9px;border-radius:12px;border:2px solid #4a2a8a;background:#24104a}
#tabs button.on{border-color:#fff34d;background:#8a2bff}
#cview{flex:1;display:flex;flex-direction:column;min-height:0}
#stage{flex:1;position:relative;min-height:120px}
#stage button{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:64px;font-size:24px;border-radius:16px;border:3px solid #fff;background:rgba(138,43,255,.8)}
#prev{left:10px}#next{right:10px}
#card{background:linear-gradient(180deg,rgba(14,3,40,.85),#0e0328);padding:14px 16px 26px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;border-top:3px solid #ff2bd6}
#cname{font-size:24px;color:#fff34d}
#cdesc{font-family:system-ui,sans-serif;font-size:14px;opacity:.9}
#cperk{font-size:14px;color:#7dff5c}
#dots{display:flex;gap:7px;margin:4px 0}
#dots i{width:10px;height:10px;border-radius:50%;background:#4a2a8a}
#dots i.own{background:#7dfcff}
#dots i.on{outline:2px solid #fff34d;outline-offset:2px}
#cbuy:disabled{filter:grayscale(.8);opacity:.6}
#ups{flex:1;overflow-y:auto;touch-action:pan-y;background:rgba(14,3,40,.97);padding:12px 14px 40px}
#shop h2{font-size:22px;color:#fff34d}
#shop h3{font-size:16px;color:#7dfcff;margin:16px 0 8px}
#bank{font-size:16px}
#close{font-size:18px;width:44px;height:44px;border-radius:12px;border:3px solid #fff;background:#8a2bff}
.it{display:flex;align-items:center;gap:10px;background:#24104a;border:2px solid #4a2a8a;border-radius:14px;padding:10px;margin-bottom:8px}
.it.sel{border-color:#fff34d}
.it .ic{font-size:30px;width:40px;text-align:center}
.it .tx{flex:1;text-align:left;font-size:14px;line-height:1.3}
.it .tx small{display:block;font-family:system-ui,sans-serif;font-size:12px;opacity:.8}
.it button{font-size:13px;padding:9px 10px;border-radius:12px;border:2px solid #fff;background:#ff2bd6;min-width:86px}
.it button:disabled{background:#444;opacity:.6}
.hide{display:none!important}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="hide">
  <div class="l"><div id="aura">AURA 0</div><div id="coins">🪙 0</div><div id="status"></div></div>
  <button id="mute" aria-label="Ton an/aus">🔊</button>
</div>
<button id="fart" class="hide">💨 x<span id="fartN">1</span></button>
<div id="hint" class="hide">TIPPEN = SCHIESSEN 🔫</div>
<div id="pops"></div>
<div id="flash"></div>
<div id="menu">
  <h1 id="title">BRAINROT<br>RUNNER 67</h1>
  <div id="sub">TUNG TUNG TUNG – Schlummer, das Riesenkissen, will dich zurück ins Bett trommeln. Renn!</div>
  <div id="stats"></div>
  <button id="go" class="big">START 🔥</button>
  <button id="shopBtn" class="big">🛒 CHARAKTER-STORE</button>
  <div id="how">📱 Wischen: ← → Spur · ↑ Springen · ↓ Rutschen<br><b>Doppeltipp = Furz-Turbo 💨</b> · Tippen = Schießen 🔫<br>⌨️ Pfeile/WASD · F = Furz · Leertaste = Schießen</div>
</div>
<div id="shop" class="hide">
  <header><h2>🛒 STORE</h2><div id="bank"></div><button id="close">✕</button></header>
  <div id="tabs"><button data-tab="c" class="on">FIGUREN</button><button data-tab="u">UPGRADES</button></div>
  <div id="cview">
    <div id="stage"><button id="prev">◀</button><button id="next">▶</button></div>
    <div id="card"><div id="cname"></div><div id="cdesc"></div><div id="cperk"></div><div id="dots"></div><button id="cbuy" class="big"></button></div>
  </div>
  <div id="ups" class="hide"></div>
</div>
<script src="three.min.js"></script>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
if(!window.THREE){$('sub').textContent='3D-Bibliothek konnte nicht geladen werden. Bitte Seite neu laden.';$('go').classList.add('hide');$('shopBtn').classList.add('hide');return;}

/* ---------- Speicherstand ---------- */
var SV={bank:0,best:0,owned:['wecki'],ch:'wecki',up:{tank:0,mag:0,t67:0,aura:0,shield:0}};
try{var raw=JSON.parse(localStorage.getItem('br67save')||'null');if(raw){for(var k in raw)SV[k]=raw[k];}else{SV.best=+localStorage.getItem('br67best')||0;}}catch(e){}
['tank','mag','t67','aura','shield'].forEach(function(k){if(!SV.up[k])SV.up[k]=0;});
function save(){try{localStorage.setItem('br67save',JSON.stringify(SV))}catch(e){}}
var CH=[{id:'wecki',n:'Wecki',ic:'⏰',c:0,d:'Der Original-Wecker',p:'Kein Bonus – purer Skill'},
{id:'toasti',n:'Toasti',ic:'🍞',c:150,d:'Knusprig und schnell',p:'+1 Bohne pro Run'},
{id:'banani',n:'Banani Boss',ic:'🍌',c:250,d:'Krumm, gelb, Sonnenbrille',p:'Springt höher'},
{id:'keks',n:'Käpt\'n Keks',ic:'🍪',c:300,d:'Krümelt beim Rennen',p:'Magnet hält +4 s'},
{id:'eisbert',n:'Eisbert',ic:'🍦',c:400,d:'Schmilzt nie, bleibt cool',p:'Schlummer bleibt nur 4 s statt 7 s'},
{id:'kaktus',n:'Disco-Kaktus',ic:'🌵',c:500,d:'Stachelig, aber sigma',p:'Startet mit Schild'},
{id:'goldi',n:'Goldi 67',ic:'🏆',c:670,d:'Pure Aura',p:'+67 % Aura'},
{id:'robo',n:'Robo-Sigma',ic:'🤖',c:800,d:'Berechnet Rizz in Echtzeit',p:'Blaster und x2 halten +2 s'}];
var UPS=[{k:'tank',n:'Bohnen-Tank',ic:'🫘',d:'+1 Furz-Turbo pro Run',cost:[80,180,320]},{k:'mag',n:'Magnet-Dauer',ic:'🧲',d:'+2 s Magnet',cost:[60,130,220,340,500]},{k:'t67',n:'67-Zeit',ic:'🔫',d:'+1,5 s Blaster und x2',cost:[90,190,320,480]},{k:'aura',n:'Aura-Boost',ic:'✨',d:'+20 % Aura',cost:[60,130,220,340,500]},{k:'shield',n:'Start-Schild',ic:'🛡️',d:'Jeder Run startet mit Schild',cost:[300]}];

/* ---------- Renderer / Szene ---------- */
var canvas=$('c');
var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
var scene=new THREE.Scene();
var bg=new THREE.Color(0x1a0638);
scene.background=bg;scene.fog=new THREE.Fog(bg,40,150);
var camera=new THREE.PerspectiveCamera(70,1,0.1,400);
var camBase=new THREE.Vector3(0,4.2,7.5),baseFov=70;
function resize(){
  var w=window.innerWidth,h=window.innerHeight;
  renderer.setSize(w,h,false);camera.aspect=w/h;
  if(w<h){baseFov=85;camBase.set(0,5,9);}else{baseFov=68;camBase.set(0,4.2,7.5);}
  camera.fov=baseFov;camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize);resize();
scene.add(new THREE.AmbientLight(0x8866ff,0.9));
var sun=new THREE.DirectionalLight(0xffffff,0.9);sun.position.set(4,10,6);scene.add(sun);
function mat(c,e){return new THREE.MeshLambertMaterial({color:c,emissive:e===undefined?0:e});}
function basic(c){return new THREE.MeshBasicMaterial({color:c});}
var LANES=[-2.2,0,2.2];

var ground=new THREE.Mesh(new THREE.PlaneGeometry(9,400),mat(0x24104a,0x0c0420));
ground.rotation.x=-Math.PI/2;ground.position.z=-150;scene.add(ground);
var side=new THREE.Mesh(new THREE.PlaneGeometry(400,400),mat(0x0d0322,0x06010f));
side.rotation.x=-Math.PI/2;side.position.set(0,-0.05,-150);scene.add(side);
var railG=new THREE.BoxGeometry(0.15,0.15,400);
[-4.5,4.5].forEach(function(x,i){var r=new THREE.Mesh(railG,basic(i?0x2be4ff:0xff2bd6));r.position.set(x,0.08,-150);scene.add(r);});
var dashes=[];var dashG=new THREE.BoxGeometry(0.12,0.02,2.2),dashM=basic(0xfff34d);
for(var i=0;i<34;i++){[-1.1,1.1].forEach(function(x){var d=new THREE.Mesh(dashG,dashM);d.position.set(x,0.02,-i*6);scene.add(d);dashes.push(d);});}
var builds=[];var bG=new THREE.BoxGeometry(1,1,1);
var neon=[0xff2bd6,0x2be4ff,0xfff34d,0x7dff5c,0xff7a2b,0x9a5cff];
function styleB(b){
  var w=3+Math.random()*4,h=4+Math.random()*16,d=4+Math.random()*5;
  b.scale.set(w,h,d);b.position.y=h/2;b.position.x=(b.userData.s)*(7.5+w/2+Math.random()*6);
  var c=neon[(Math.random()*neon.length)|0];
  b.material.color.setHex(c);b.material.emissive.setHex(c);b.material.emissiveIntensity=0.25+Math.random()*0.3;
}
for(i=0;i<44;i++){var b=new THREE.Mesh(bG,new THREE.MeshLambertMaterial());b.userData.s=i%2?1:-1;styleB(b);b.position.z=-(i>>1)*9+10;scene.add(b);builds.push(b);}
var sp=[];for(i=0;i<300;i++){sp.push((Math.random()-0.5)*400,20+Math.random()*120,-60-Math.random()*200);}
var sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));
scene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:0.9,fog:false})));
function textTex(txt,fill,stroke,round,font){
  var cv=document.createElement('canvas');cv.width=cv.height=256;var x=cv.getContext('2d');
  if(round){x.fillStyle=round;x.beginPath();x.arc(128,128,124,0,7);x.fill();}
  x.font=font||'900 150px Impact, Arial Black, sans-serif';x.textAlign='center';x.textBaseline='middle';
  if(stroke){x.lineWidth=18;x.strokeStyle=stroke;x.strokeText(txt,128,138);}
  x.fillStyle=fill;x.fillText(txt,128,138);
  return new THREE.CanvasTexture(cv);
}
function emoTex(e,ring){return textTex(e,'#fff',null,ring,'140px serif');}
var moon=new THREE.Sprite(new THREE.SpriteMaterial({map:textTex('67','#7a5a00','#fff7b0','#ffe45c'),fog:false}));
moon.scale.set(46,46,1);moon.position.set(-38,62,-230);scene.add(moon);

/* ---------- Spielfigur ---------- */
var player=new THREE.Group();scene.add(player);
var bodyG=new THREE.Group();player.add(bodyG);
var legL=new THREE.Group(),legR=new THREE.Group(),armL=new THREE.Group(),armR=new THREE.Group();
var BLK=basic(0x111111),WHT=basic(0xffffff);
(function(){
  var shoe=mat(0xfff34d,0x554a00);
  var lg=new THREE.CylinderGeometry(0.07,0.07,0.5,8);lg.translate(0,-0.25,0);
  var sh=new THREE.BoxGeometry(0.24,0.14,0.42);sh.translate(0,-0.55,-0.06);
  [[legL,-0.26],[legR,0.26]].forEach(function(p){p[0].position.set(p[1],0.62,0);p[0].add(new THREE.Mesh(lg,BLK));p[0].add(new THREE.Mesh(sh,shoe));player.add(p[0]);});
  var ag=new THREE.CylinderGeometry(0.05,0.05,0.5,8);ag.translate(0,-0.25,0);
  var hand=new THREE.SphereGeometry(0.1,8,8);hand.translate(0,-0.52,0);
  [[armL,-0.68],[armR,0.68]].forEach(function(p){p[0].position.set(p[1],1.25,0);p[0].add(new THREE.Mesh(ag,BLK));p[0].add(new THREE.Mesh(hand,WHT));player.add(p[0]);});
})();
function part(geo,m,x,y,z){var o=new THREE.Mesh(geo,m);o.position.set(x||0,y||0,z||0);bodyG.add(o);return o;}
function faceAt(z,y,cool){
  var w=new THREE.SphereGeometry(0.12,10,10),p=new THREE.SphereGeometry(0.06,8,8);
  [-0.19,0.19].forEach(function(x){part(w,WHT,x,y+0.12,z-0.04);part(p,BLK,x,y+0.12,z+0.06);var b=part(new THREE.BoxGeometry(0.2,0.04,0.04),BLK,x,y+0.3,z+0.03);b.rotation.z=x<0?0.25:-0.25;});
  if(cool)part(new THREE.BoxGeometry(0.66,0.17,0.06),BLK,0,y+0.12,z+0.1);
  part(new THREE.BoxGeometry(0.26,0.1,0.03),BLK,0,y-0.17,z);part(new THREE.BoxGeometry(0.1,0.05,0.035),basic(0xff5c7a),0,y-0.2,z+0.005);
}
function buildBody(id){
  player.remove(bodyG);bodyG=new THREE.Group();player.add(bodyG);
  if(id==='banani'){
    var ym=mat(0xffe135,0x6a5a00),br=mat(0x5a3a10,0x1a0a00);
    var tr=part(new THREE.TorusGeometry(0.9,0.3,10,18,Math.PI*0.7),ym,-0.9,1.3,0);tr.rotation.z=-Math.PI*0.35;
    var tip=new THREE.SphereGeometry(0.14,8,8);part(tip,br,-0.49,2.12,0);part(tip,br,-0.49,0.48,0);
    part(new THREE.BoxGeometry(0.4,0.05,0.02),br,-0.1,1.85,0.27).rotation.z=0.6;
    part(new THREE.TorusGeometry(0.2,0.04,6,14),mat(0xffc81f,0x7a5a00),0,0.85,0.3);
    faceAt(0.3,1.3,true);
  }else if(id==='eisbert'){
    var cone=part(new THREE.ConeGeometry(0.5,1.0,16),mat(0xd9a15a,0x4a2c0a),0,0.95,0);cone.rotation.x=Math.PI;
    part(new THREE.SphereGeometry(0.52,16,12),mat(0xff9ad8,0x6a1a50),0,1.65,0);
    part(new THREE.SphereGeometry(0.4,14,10),mat(0x9af5e0,0x1a5a4a),0,2.25,0);
    part(new THREE.SphereGeometry(0.12,8,8),mat(0xff2b2b,0x6a0505),0,2.7,0);
    var sg2=new THREE.BoxGeometry(0.1,0.035,0.035),sc=[0xfff34d,0x2be4ff,0xff2bd6,0xffffff];
    for(var q=0;q<10;q++){var sp2=part(sg2,basic(sc[q%4]),Math.cos(q*0.63)*0.37,2.33+Math.sin(q*2)*0.1,Math.sin(q*0.63)*0.37);sp2.rotation.z=q;}
    faceAt(0.5,1.65);
  }else if(id==='robo'){
    var gm=mat(0xb8c0cc,0x2a3038),dm=mat(0x5a6470,0x15181c);
    part(new THREE.BoxGeometry(0.95,0.8,0.6),gm,0,1.05,0);part(new THREE.BoxGeometry(0.72,0.55,0.56),gm,0,1.78,0);part(new THREE.BoxGeometry(0.3,0.1,0.3),dm,0,1.48,0);
    part(new THREE.BoxGeometry(0.54,0.16,0.05),basic(0x2be4ff),0,1.84,0.29);part(new THREE.BoxGeometry(0.3,0.05,0.05),BLK,0,1.62,0.29);
    part(new THREE.CylinderGeometry(0.03,0.03,0.35,6),dm,0,2.22,0);part(new THREE.SphereGeometry(0.08,8,8),basic(0xff2b2b),0,2.42,0);
    part(new THREE.BoxGeometry(0.1,0.25,0.25),dm,-0.41,1.78,0);part(new THREE.BoxGeometry(0.1,0.25,0.25),dm,0.41,1.78,0);
    part(new THREE.CircleGeometry(0.14,12),basic(0x7dff5c),-0.2,1.15,0.31);
    part(new THREE.BoxGeometry(0.3,0.06,0.02),basic(0xfff34d),0.2,1.2,0.31);part(new THREE.BoxGeometry(0.3,0.06,0.02),basic(0xff2bd6),0.2,1.05,0.31);
  }else if(id==='toasti'){
    part(new THREE.BoxGeometry(1.15,0.95,0.55),mat(0xd8dde6,0x3a3f48),0,1.12,0);
    var t=new THREE.BoxGeometry(0.42,0.5,0.12),tm=mat(0xe0a45a,0x5a3a10);
    part(t,tm,-0.26,1.72,-0.1);part(t,tm,0.26,1.72,0.1);
    part(new THREE.BoxGeometry(0.2,0.08,0.05),basic(0xff2b4f),0.38,0.85,0.29);faceAt(0.3,1.15);
  }else if(id==='keks'){
    var c=part(new THREE.CylinderGeometry(0.68,0.68,0.26,26),mat(0xd9a15a,0x4a2c0a),0,1.15,0);c.rotation.x=Math.PI/2;
    var ch=new THREE.SphereGeometry(0.09,8,8),cm=basic(0x4a2408);
    [[-0.4,1.45],[0.42,1.4],[-0.45,0.95],[0.38,0.82],[0,1.6],[0.05,0.72]].forEach(function(p){part(ch,cm,p[0],p[1],0.13);});faceAt(0.15,1.15);
  }else if(id==='kaktus'){
    var g=mat(0x3fd45a,0x0d4a1a);
    part(new THREE.CylinderGeometry(0.46,0.46,1.0,18),g,0,1.15,0);part(new THREE.SphereGeometry(0.46,18,12),g,0,1.65,0);
    part(new THREE.SphereGeometry(0.16,10,10),mat(0xff4fd8,0x7a0a60),0.12,2.15,0);
    var st=new THREE.SphereGeometry(0.04,6,6);for(var a=0;a<10;a++)part(st,WHT,Math.cos(a*2)*0.47,0.8+a*0.1,Math.sin(a*2)*0.47);
    faceAt(0.47,1.25);

      else if(o.t==='enemy'){m.position.z+=5*dt;m.position.y=Math.abs(Math.sin(S.t*8+o.ph))*0.45;}
      else if(o.hd===0.3&&o.t!=='low'&&o.t!=='high'){m.position.y=1.3+Math.sin(S.t*6+o.ph)*0.25;}
      var near=m.position.z>-(o.hd+0.45)&&o.pz<(o.hd+0.45)&&Math.abs(px-m.position.x)<1;
      if(near){
        var t=o.t;
        if(t==='coin'){
          if(Math.abs(S.py+1-m.position.y)<1.3){scene.remove(m);objs.splice(i,1);S.coins++;S.aura+=10*auraMul();sfx('coin');
            if(S.coins===67)sixSeven('67 COINS!!');continue;}
        }else if(t==='tok'){kill(i);sixSeven();continue;}
        else if(t==='gun'){kill(i);S.gunT=T67();S.espawn=0.2;sfx('power');sfx('horn');pop('BLASTER! 🔫',true,50,40);say('lock in',0.6);$('hint').classList.remove('hide');continue;}
        else if(t==='mag'){kill(i);S.magT=8+SV.up.mag*2+(SV.ch==='keks'?4:0);sfx('power');pop('MAGNET 🧲',false,50,50);continue;}
        else if(t==='shd'){kill(i);S.shield=true;sfx('power');pop('SCHILD 🛡️',false,50,50);continue;}
        else if(t==='bean'){kill(i);S.farts++;sfx('power');fartBlip(ac?ac.currentTime+0.1:0,0.25);pop('+1 BOHNE 🫘',false,50,50);continue;}
        else if((t==='low'&&S.py<0.8)||(t==='enemy'&&S.py<1.0)||(t==='high'&&!(sl&&player.scale.y<0.8))||t==='train'){if(hit(i))break;continue;}
      }
      if(m.position.z>14+o.hd){scene.remove(m);objs.splice(i,1);}
    }
    $('aura').textContent='AURA '+Math.floor(S.aura);
    $('coins').textContent='🪙 '+S.coins+(S.coins<67?' / 67':'');
    var st=[];if(S.multT>0)st.push('67-MODUS x2 · '+S.multT.toFixed(1)+'s');if(S.gunT>0)st.push('🔫 '+S.gunT.toFixed(1)+'s');if(boost)st.push('💨 '+S.fartT.toFixed(1)+'s');if(S.magT>0)st.push('🧲 '+S.magT.toFixed(0)+'s');if(S.shield)st.push('🛡️ AKTIV');if(S.chase>0&&!boost)st.push('⚠️ SCHLUMMER IST DA!');
    $('status').textContent=st.join('\n');
    $('fartN').textContent=S.farts;$('fart').classList.toggle('off',S.farts<=0||boost);
  }else player.visible=true;
  // Wolken
  for(var ci=0;ci<clouds.length;ci++){var cl=clouds[ci];if(!cl.visible)continue;cl.position.z+=dt*9;cl.position.y+=dt*1.2;var s=cl.scale.x+dt*3.5;cl.scale.set(s,s,1);cl.material.opacity-=dt*1.3;if(cl.material.opacity<=0)cl.visible=false;}
  // Verfolger
  var cz=(S.run&&S.chase>0)?3.3:15;
  chaser.position.z+=(cz-chaser.position.z)*Math.min(1,dt*(cz<10?4:2));
  chaser.position.x+=(player.position.x-chaser.position.x)*Math.min(1,dt*5);
  chaser.position.y=Math.abs(Math.sin(now*0.012))*0.35;chaser.rotation.z=Math.sin(now*0.012)*0.12;
  cArmL.rotation.z=0.4+Math.sin(now*0.02)*0.5;cArmR.rotation.z=-0.4-Math.cos(now*0.02)*0.5;
  chaser.visible=chaser.position.z<camBase.z+3;
  // Welt
  for(var j=0;j<dashes.length;j++){var d=dashes[j];d.position.z+=mv;if(d.position.z>10)d.position.z-=204;}
  for(j=0;j<builds.length;j++){var b=builds[j];b.position.z+=mv;if(b.position.z>20){b.position.z-=198;styleB(b);}}
  if(S.run&&(S.multT>0||S.gunT>0)){hue=(hue+dt*0.9)%1;tmpC.setHSL(hue,0.8,0.22);bg.lerp(tmpC,0.2);}
  else if(S.run&&boost){tmpC.setHex(0x1f4a0a);bg.lerp(tmpC,0.1);}else bg.lerp(baseBg,0.08);
  // Kamera
  var tf=baseFov+(S.run&&boost?14:0);if(Math.abs(camera.fov-tf)>0.1){camera.fov+=(tf-camera.fov)*Math.min(1,dt*5);camera.updateProjectionMatrix();}
  if(S.run&&boost)shake=Math.max(shake,0.12);
  kick*=Math.pow(0.002,dt);shake*=Math.pow(0.02,dt);
  if(shopOpen&&tab==='c'){
    player.position.set(0,Math.abs(Math.sin(now*0.006))*0.15,0);player.rotation.set(0,Math.sin(now*0.0015),0);player.scale.set(1,1,1);shieldM.visible=false;
    var sw2=Math.sin(now*0.008)*0.5;legL.rotation.x=sw2;legR.rotation.x=-sw2;armL.rotation.x=-sw2;armR.rotation.x=sw2;
    camera.position.set(0,1.5,camera.aspect<1?3.3:3.1);camera.lookAt(0,camera.aspect<1?0.2:0.5,0);
  }else{
  camera.position.set(camBase.x+player.position.x*0.45+(Math.random()-0.5)*shake,camBase.y+(Math.random()-0.5)*shake+kick*0.12,camBase.z-kick*0.25);
  camera.lookAt(player.position.x*0.3,1.6,-9);
  camera.rotation.z+=Math.sin(now*0.002)*0.012+(S.multT>0?Math.sin(now*0.02)*0.02:0);
  }
  moon.material.rotation=Math.sin(now*0.001)*0.2;
  renderer.render(scene,camera);
}
requestAnimationFrame(frame);
})();
