name: Build APK
on:
  push:
    paths-ignore: ['docs/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BrainrotRunner67-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: APK in den Branch legen
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk BrainrotRunner67.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f BrainrotRunner67.apk
          git commit -m "APK gebaut [skip ci]" || exit 0
          git push
